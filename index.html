<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
  </header>

  <main>
    <!-- 1. Summary cards -->
    <section class="summary">
      <div class="card income">
        <h3>Total Income</h3>
        <p id="total-income">₹0.00</p>
      </div>
      <div class="card expense">
        <h3>Total Expenses</h3>
        <p id="total-expense">₹0.00</p>
      </div>
      <div class="card balance">
        <h3>Balance</h3>
        <p id="balance">₹0.00</p>
      </div>
    </section>

    <!-- 2. Add / Edit form -->
    <section class="form-section">
      <h2 id="form-title">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="field">
          <label for="type">Type</label>
          <select id="type">
            <option value="">Select type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <small class="error" id="type-error"></small>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01">
          <small class="error" id="amount-error"></small>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select category</option>
          </select>
          <small class="error" id="category-error"></small>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date">
          <small class="error" id="date-error"></small>
        </div>

        <div class="field full">
          <label for="description">Description</label>
          <input type="text" id="description" maxlength="60" placeholder="e.g. Lunch with friends">
          <small class="error" id="description-error"></small>
        </div>

        <div class="actions full">
          <button type="submit" id="submit-btn">Add Transaction</button>
          <button type="button" id="cancel-btn" hidden>Cancel Edit</button>
        </div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <!-- 3. Filters -->
    <section class="filters">
      <select id="filter-type">
        <option value="all">All types</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <select id="filter-category">
        <option value="all">All categories</option>
      </select>
    </section>

    <!-- 4. Transaction list -->
    <section class="list-section">
      <h2>Transactions</h2>
      <ul id="transaction-list"></ul>
      <p id="empty-state">No transactions yet.</p>
    </section>

    <!-- 5. Monthly summary + chart (bonus) -->
    <section class="insights">
      <div class="monthly">
        <h2>Monthly Summary</h2>
        <div id="monthly-summary"></div>
      </div>
      <div class="chart-box">
        <h2>Expenses by Category</h2>
        <canvas id="category-chart"></canvas>
        <ul id="category-breakdown"></ul>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
